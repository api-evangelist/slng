        - type: object
          required:
            - speaker
          properties:
            speaker:
              $ref: '#/components/schemas/RimeArcanaSpeakerDe'
        - $ref: '#/components/schemas/RimeArcanaTtsRequestBase'
    RimeArcanaSpeakerDe:
      type: string
      description: Voice speaker ID (German voices).
      default: sigurd
      enum:
        - bergmann_katharina
        - lorelei
        - rosenfeld_steffi
        - runa
        - sigurd
    ProviderErrorResponse:
      type: object
      description: >
        Provider error response. Contains error information from the upstream
        provider.

        Common errors include invalid speakers, unsupported languages, or
        malformed requests.
      properties:
        error:
          type: string
          description: >-
            Error type or category (e.g., "TTS service error", "Validation
            error").
          example: TTS service error
        status:
          type: number
          description: >-
            Original HTTP status code from the provider (may differ from gateway
            response code).
          example: 400
        details:
          type: string
          description: >
            Detailed error message from the provider. For TTS errors, this
            typically includes

            the specific validation failure (e.g., invalid speaker ID for the
            selected model/language).
          example: >-
            Rime TTS API error: 400 Bad Request - Invalid argument: Invalid
            speaker: aurelie
      required:
        - error
    RimeArcanaTtsRequestAr:
      description: Rime Arcana TTS request for Arabic.
      allOf:
        - type: object
          required:
            - speaker
          properties:
            speaker:
              $ref: '#/components/schemas/RimeArcanaSpeakerAr'
        - $ref: '#/components/schemas/RimeArcanaTtsRequestBase'
    RimeArcanaSpeakerAr:
      type: string
      description: Voice speaker ID (Arabic voices).
      default: sakina
      enum:
        - haqq
        - layla
        - qadir
        - sakina
        - shams
    AudioBinary:
      type: string
      format: binary
      description: Binary audio data.
    OrpheusTtsRequest:
      allOf:
        - $ref: '#/components/schemas/TtsVoiceSpeedRequestBase'
        - type: object
          properties:
            prompt:
              $ref: '#/components/schemas/TextToSynthesize'
            text:
              allOf:
                - $ref: '#/components/schemas/TextToSynthesize'
              description: Text to synthesize (legacy, use prompt).
            voice:
              type: string
              description: Voice identifier.
              enum:
                - tara
                - leah
                - jess
                - leo
                - dan
                - mia
                - zac
                - zoe
              default: tara
            stream:
              type: boolean
              description: Enable streaming response.
            emotion:
              type: string
              description: Emotion to apply.
              enum:
                - neutral
                - happy
                - sad
                - angry
                - surprised
    TtsVoiceSpeedRequestBase:
      allOf:
        - $ref: '#/components/schemas/TtsVoiceRequestBase'
        - type: object
          properties:
            speed:
              $ref: '#/components/schemas/SpeechSpeedMultiplier'
    SpeechSpeedMultiplier:
      type: number
      minimum: 0.5
      maximum: 2
      description: Speed multiplier (0.5-2.0).
    TtsVoiceRequestBase:
      type: object
      properties:
        text:
          $ref: '#/components/schemas/TextToSynthesize'
        voice:
          type: string
          description: Voice identifier.
    RimeCoda0IdTtsRequestId:
      description: Rime Coda TTS request for Bahasa Indonesian.
      allOf:
        - $ref: '#/components/schemas/RimeCoda0IdTtsRequestBase'
    RimeCoda0IdTtsRequestBase:
      description: Base schema for Rime Coda Indonesian TTS requests.
      allOf:
        - type: object
          required:
            - speaker
          properties:
            speaker:
              $ref: '#/components/schemas/RimeCoda0IdSpeaker'
        - $ref: '#/components/schemas/RimeCodaTtsRequestCommon'
    RimeCodaTtsRequestCommon:
      type: object
      description: Common Rime Coda TTS options.
      properties:
        text:
          type: string
          minLength: 1
          description: Text to synthesize.
        modelId:
          $ref: '#/components/schemas/RimeCodaModelId'
        lang:
          $ref: '#/components/schemas/RimeCodaLanguage'
        top_p:
          type: number
          format: float
          default: 1
          description: >-
            The top p. Float that controls the cumulative probability of the top
            tokens to consider. Must be in (0, 1]. Set to 1 to consider all
            tokens.
        audioFormat:
          $ref: '#/components/schemas/RimeArcanaAudioFormat'
        sample_rate:
          $ref: '#/components/schemas/RimeArcanaSampleRate'
        speed:
          type: number
          description: Speech rate multiplier (0.25 = half speed, 2.0 = double speed).
          minimum: 0.25
          maximum: 2
          default: 1
        segment:
          type: boolean
          default: false
          description: Enable segment markers in output.
      required:
        - text
    RimeCodaModelId:
      type: string
      description: Rime Coda model identifier.
      enum:
        - coda
      default: coda
    RimeCodaLanguage:
      type: string
      description: Language code. Coda Indonesian variant only supports Bahasa Indonesian.
      enum:
        - id
      default: id
    RimeCoda0IdSpeaker:
      type: string
      description: Voice speaker ID for Rime Coda Indonesian.
      default: pujianti_plesmita
      enum:
        - pujianti_plesmita
        - siswoko_sigit
        - taryadi_dani
        - usmany_tatianna
  responses:
    SlngDeepgramAuraUnauthorized:
      description: >
        Unauthorized error for SLNG-hosted Deepgram Aura TTS. Returned when the
        Authorization header is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SlngDeepgramAuraUnauthorizedResponse'
          example:
            title: Unauthorized
            status: 401
            detail: No Authorization Header
    SlngDeepgramAuraBadRequest:
      description: >
        Bad request for SLNG-hosted Deepgram Aura TTS. Can be a validation error
        (missing/invalid fields) or a provider error (invalid query parameters).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SlngDeepgramAuraBadRequestResponse'
          examples:
            Missing required field:
              summary: Validation error — missing required field
              value:
                error: Text is required
                fieldErrors:
                  text:
                    - Required
            Invalid encoding value:
              summary: Invalid encoding value
              value:
                error: TTS service error
                details: >-
                  {"err_code":"INVALID_QUERY_PARAMETER","err_msg":"Failed to
                  deserialize query parameters: unknown variant `sss`, expected
                  one of `linear16`, `mulaw`, `alaw`, `mp3`, `opus`, `flac`,
                  `aac`","request_id":"9740fb95-d205-49f4-91c5-ab2f97bb09fa"}
            Model not found:
              summary: Model or version not found
              value:
                error: TTS service error
                details: >-
                  {"err_code":"Bad Request","err_msg":"No such model/version
                  combination
                  found.","request_id":"8ccc6b44-5f96-4d21-9b4d-3011fa36b2e9"}
    RimeArcanaInternalServerError:
      description: >
        Rime Arcana TTS internal error. Note: Some validation errors (e.g.,
        invalid speaker)

        may currently return 500 instead of 400. Check the error details for
        specifics.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProviderErrorResponse'
          examples:
            processing-error:
              summary: Processing error
              value:
                error: TTS service error
                details: Internal processing error
            invalid-speaker-as-500:
              summary: Invalid speaker (returned as 500)
              description: |
                Invalid speaker errors may currently return 500 instead of 400.
                The details field will indicate the actual validation error.
              value:
                error: TTS service error
                details: >-
                  Rime TTS API error: 400 Bad Request - Invalid argument:
                  Invalid speaker: aurelie
    RimeArcanaBadRequest:
      description: >
        Rime Arcana TTS bad request. Common causes include invalid speaker ID
        for the

        selected language variant, unsupported model, unsupported audio format,
        or malformed request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProviderErrorResponse'
          examples:
            invalid-speaker:
              summary: Invalid speaker ID
              description: >
                Speaker ID not available for this language variant. Each Arcana
                language

                has specific voices - check the endpoint schema for valid
                speakers.
              value:
                error: TTS service error
                details: >-
                  Rime TTS API error: 400 Bad Request - Invalid argument:
                  Invalid speaker: aurelie
            invalid-speaker-for-language:
              summary: Speaker not available for language
              description: Using a speaker from a different language variant.
              value:
                error: TTS service error
                details: >-
                  Rime TTS API error: 400 Bad Request - Invalid argument:
                  Invalid speaker: astra
            missing-text:
              summary: Missing text field
              value:
                error: Validation error
                details: 'Missing required field: text'
            unsupported-model:
              summary: Unsupported model
              description: The specified modelId is not supported by Rime Arcana.
              value:
                error: TTS service error
                details: 'Rime TTS API error: 400 Bad Request - Unsupported model'
    RimeCodaInternalServerError:
      description: >
        Rime Coda TTS internal error. Note: Some validation errors (e.g.,
        invalid speaker) may currently return 500 instead of 400. Check the
        error details for specifics.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProviderErrorResponse'
          examples:
            processing-error:
              summary: Processing error
              value:
                error: TTS service error
                details: Internal processing error
    RimeCodaBadRequest:
      description: >
        Rime Coda TTS bad request. Common causes include invalid speaker ID,
        unsupported audio format, or malformed request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProviderErrorResponse'
          examples:
            invalid-speaker:
              summary: Invalid speaker ID
              value:
                error: TTS service error
                details: >-
                  Rime TTS API error: 400 Bad Request - Invalid argument:
                  Invalid speaker
            missing-text:
              summary: Missing text field
              value:
                error: Validation error
                details: 'Missing required field: text'
    ProviderServiceUnavailable:
      description: Service unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProviderErrorResponse'
    ProviderInternalServerError:
      description: Internal server error from the provider.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProviderErrorResponse'
          examples:
            processing-error:
              summary: Processing error
              value:
                error: Service error
                details: Internal processing error
    ProviderUnauthorized:
      description: Invalid or missing API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProviderErrorResponse'
    ProviderBadRequest:
      description: Bad request - invalid parameters provided.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProviderErrorResponse'
          examples:
            validation-error:
              summary: Validation error
              value:
                error: Validation error
                details: 'Missing required field: text'
    TtsSynthesisSuccess:
      description: Synthesis successful.
      content:
        audio/*:
          schema:
            $ref: '#/components/schemas/AudioBinary'
    SlngInworldMaxSuccess:
      description: >
        Synthesis successful. Unlike other SLNG TTS models (which return raw
        audio bytes), Inworld Max responds with JSON: the request is
        SLNG-normalized but the response is Inworld's native body passed through
        unchanged, carrying base64-encoded audio plus usage and optional
        timestamp metadata.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SlngInworldMaxSuccessBody'
          examples:
            basic:
              summary: Synthesis result (audioContent truncated for brevity)
              value:
                audioContent: SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAA
                usage:
                  processedCharactersCount: 48
                  modelId: inworld-tts-1.5-max
            wordTimestamps:
              summary: Result with WORD timestamps (timestampType=WORD)
              value:
                audioContent: SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAA
                usage:
                  processedCharactersCount: 13
                  modelId: inworld-tts-1.5-max
                timestampInfo:
                  wordAlignment:
                    words:
                      - Hello,
                      - world!
                    wordStartTimeSeconds:
                      - 0
                      - 0.51
                    wordEndTimeSeconds:
                      - 0.51
                      - 1.04
                    phoneticDetails:
                      - wordIndex: 0
                        isPartial: false
                        phones:
                          - phoneSymbol: h
                            startTimeSeconds: 0
                            durationSeconds: 0.17
                            visemeSymbol: aei
                          - phoneSymbol: ə
                            startTimeSeconds: 0.17
                            durationSeconds: 0.05
                            visemeSymbol: aei
                          - phoneSymbol: l
                            startTimeSeconds: 0.22
                            durationSeconds: 0.11
                            visemeSymbol: l
                          - phoneSymbol: oʊ1
                            startTimeSeconds: 0.33
                            durationSeconds: 0.18
                            visemeSymbol: o
            characterTimestamps:
              summary: Result with CHARACTER timestamps (timestampType=CHARACTER)
              value:
                audioContent: SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAA
                usage:
                  processedCharactersCount: 12
                  modelId: inworld-tts-1.5-max
                timestampInfo:
                  characterAlignment:
                    characters:
                      - H
                      - e
                      - l
                      - l
                      - o
                      - w
                      - o
                      - r
                      - l
                      - d
                      - .
                    characterStartTimeSeconds:
                      - 0
                      - 0.11
                      - 0.21
                      - 0.32
                      - 0.42
                      - 0.57
                      - 0.66
                      - 0.75
                      - 0.84
                      - 0.93
                      - 1.02
                    characterEndTimeSeconds:
                      - 0.11
                      - 0.21
                      - 0.32
                      - 0.42
                      - 0.53
                      - 0.66
                      - 0.75
                      - 0.84
                      - 0.93
                      - 1.02
                      - 1.11
