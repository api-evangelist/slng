name: SLNG
description: >-
  SLNG is a compliance-first speech AI gateway that gives developers a single,
  unified API for speech-to-text, text-to-speech, and LLM-driven voice agents
  across 30+ models from providers like Deepgram, Rime, Cartesia, ElevenLabs,
  and OpenAI Whisper. The platform acts as an execution layer between an
  orchestrator and the models, routing each request to in-region compute across
  60+ regions and 11 sovereign hubs for low latency and local data residency
  (GDPR), with ISO 27001 certification and HIPAA compliance. Every model is
  reachable over HTTP or streaming WebSocket, with bring-your-own-key billing,
  batch transcription, pronunciation dictionaries, and per-minute pricing.
  Founded in Barcelona in 2025 and backed by a pre-seed round led by Earlybird.
