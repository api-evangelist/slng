        description: Initialize a German Rime Arcana TTS session.
        required:
          - type
          - model
          - speaker
        properties:
          type:
            type: string
            const: init
          model:
            type: string
            description: The model identifier.
          speaker:
            $ref: '#/components/schemas/SlngRimeArcana2SpeakerDe'
          config:
            $ref: '#/components/schemas/SlngRimeArcana2TtsConfig'
          repetition_penalty:
            type: number
            format: float
            default: 1.5
            description: >-
              The repetition penalty. We do not recommend changing this from the
              default value. Typical range is 1 to 2. Float that penalizes new
              tokens based on whether they appear in the prompt and the
              generated text so far. Values > 1 encourage the model to use new
              tokens, while values < 1 encourage the model to repeat tokens.
          temperature:
            type: number
            format: float
            default: 0.5
            description: >-
              The temperature. We do not recommend changing this from the
              default value. Typical range is 0 to 1. Float that controls the
              randomness of the sampling. Lower values make the model more
              deterministic, while higher values make the model more random.
              Zero means greedy sampling.
          top_p:
            type: number
            format: float
            default: 1
            description: >-
              The top p. We do not recommend changing this from the default
              value. Typical range is 0 to 1. Float that controls the cumulative
              probability of the top tokens to consider. Must be in (0, 1]. Set
              to 1 to consider all tokens.
      examples:
        - name: arcana2InitDe
          summary: Initialize German TTS session
          payload:
            type: init
            model: rime/arcana:de
