    SlngInworldMaxInitRequest:
      name: SlngInworldMaxInitRequest
      title: Init Request (Inworld Max 1.5)
      summary: Initialize an SLNG-hosted Inworld Max 1.5 session.
      contentType: application/json
      payload:
        type: object
        description: >-
          Initialize a session with voice and audio configuration. Sent once per
          WebSocket connection before any text frames. Audio output uses flat
          fields (encoding, sample_rate, bit_rate, speaking_rate) that the
          gateway maps to Inworld's audioConfig.
        required:
          - type
        properties:
          type:
            type: string
            const: init
            default: init
          voice:
            type: string
            default: Ashley
            description: >-
              Inworld voice ID. Voices are multilingual — each has a native
              language but can speak any supported language via the `language`
              parameter (best results when `language` matches the voice's native
              language). See the full catalog at
              https://docs.slng.ai/voices/inworld.
          modelId:
            type: string
            enum:
              - inworld-tts-1.5-max
            default: inworld-tts-1.5-max
            description: ID of the Inworld TTS model.
          language:
            $ref: '#/components/schemas/SlngInworldMaxLanguage'
          deliveryMode:
            type: string
            enum:
              - DELIVERY_MODE_UNSPECIFIED
              - STABLE
              - BALANCED
              - CREATIVE
            description: >-
              Only applies to inworld-tts-2. Controls output variation; ignored
              on Max 1.5.
          temperature:
            type: number
            exclusiveMinimum: 0
            maximum: 2
            default: 1
            description: >-
              Higher values produce more expressive output; lower values more
              deterministic. Range (0, 2].
          timestampType:
            type: string
            enum:
              - TIMESTAMP_TYPE_UNSPECIFIED
              - WORD
              - CHARACTER
            default: TIMESTAMP_TYPE_UNSPECIFIED
            description: Controls timestamp metadata returned with the audio. Adds latency.
          applyTextNormalization:
            type: string
            enum:
              - APPLY_TEXT_NORMALIZATION_UNSPECIFIED
              - 'ON'
              - 'OFF'
            default: APPLY_TEXT_NORMALIZATION_UNSPECIFIED
            description: >-
              Expands numbers, dates, and abbreviations before synthesis.
              Disabling may reduce latency.
          timestampTransportStrategy:
            type: string
            enum:
              - TIMESTAMP_TRANSPORT_STRATEGY_UNSPECIFIED
              - SYNC
              - ASYNC
            description: >-
              Whether timestamp data arrives synchronously with audio or in
              trailing messages.
          autoMode:
            type: boolean
            description: When enabled, the server controls flushing automatically.
          maxBufferDelayMs:
            type: integer
            description: Maximum text buffering delay before synthesis starts.
          bufferCharThreshold:
            type: integer
            minimum: 0
            maximum: 1000
            description: Character buffer threshold before synthesis starts.
          encoding:
            type: string
            enum:
              - LINEAR16
              - MP3
              - OGG_OPUS
              - ALAW
              - MULAW
              - FLAC
              - PCM
              - WAV
            default: MP3
            description: Output audio format. Maps to Inworld audioConfig.audioEncoding.
          sample_rate:
            type: integer
            enum:
              - 8000
              - 16000
              - 22050
              - 24000
              - 32000
              - 44100
              - 48000
            default: 48000
            description: >-
              Output sample rate in Hz. Maps to Inworld
              audioConfig.sampleRateHertz.
          bit_rate:
            type: integer
            description: >-
              Bits per second. Only applies to compressed formats (MP3,
              OGG_OPUS). Maps to Inworld audioConfig.bitRate.
          speaking_rate:
            type: number
            minimum: 0.5
            maximum: 1.5
            default: 1
            description: >-
              Playback speed. Values below 0.8 not recommended for quality. Maps
              to Inworld audioConfig.speakingRate.
      examples:
        - name: inworldMaxInit
          summary: Initialize Inworld Max 1.5 session
          payload:
            type: init
            voice: Ashley
            modelId: inworld-tts-1.5-max
            language: en-US
            encoding: MP3
            sample_rate: 24000
