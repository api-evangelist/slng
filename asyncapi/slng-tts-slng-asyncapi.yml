    TtsInitRequest:
      name: TtsInitRequest
      title: Init Request
      summary: Initialize a TTS session with model and voice configuration.
      contentType: application/json
      payload:
        type: object
        description: >-
          Initialize a session with model and voice configuration before sending
          text.
        required:
          - type
          - model
        properties:
          type:
            type: string
            const: init
            default: init
          model:
            $ref: '#/components/schemas/TtsModel'
          voice:
            type: string
            description: Voice identifier
          config:
            type: object
            description: Synthesis configuration options
            properties:
              sample_rate:
                $ref: '#/components/schemas/SampleRate'
              encoding:
                type: string
                description: Audio encoding format
                enum:
                  - linear16
                  - mp3
                  - opus
              language:
                $ref: '#/components/schemas/LanguageCode'
              speed:
                type: number
                description: Speech speed multiplier (e.g., 1.0 for normal)
