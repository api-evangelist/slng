  schemas:
    DeepgramSttResultsPayload:
      type: object
      description: >
        Deepgram native Results message. Contains the transcription in
        channel.alternatives[0].transcript. Use is_final to distinguish partial
        (interim) from final results, and speech_final to detect
        end-of-utterance boundaries.
      required:
        - type
        - channel
      properties:
        type:
          type: string
          const: Results
        is_final:
          type: boolean
          description: true for final results, false for interim/partial
        speech_final:
          type: boolean
          description: true when endpoint detection fires (end of utterance)
        channel_index:
          type: array
          items:
            type: integer
          description: Channel index pair [channel, total_channels]
        channel:
          type: object
          description: Deepgram channel result with transcription alternatives
          properties:
            alternatives:
              type: array
              items:
                type: object
                properties:
                  transcript:
                    type: string
                    description: Transcribed text
                  confidence:
                    type: number
                    description: Confidence score (0-1)
                  words:
                    type: array
                    description: Word-level transcription details
                    items:
                      type: object
                      properties:
                        word:
                          type: string
                        start:
                          type: number
                          description: Word start time in seconds
                        end:
                          type: number
                          description: Word end time in seconds
                        confidence:
                          type: number
                        speaker:
                          type: integer
                          description: Speaker ID (when diarization enabled)
                        punctuated_word:
                          type: string
        start:
          type: number
          description: Start time of this segment in seconds
        duration:
          type: number
          description: Duration of this segment in seconds
    SlngDeepgramNova3MultiSttInitPayload:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: init
        config:
          type: object
          description: Recognition configuration options
          properties:
            language:
              type: string
              description: Supported language code.
              default: multi
              enum:
                - multi
            sample_rate:
              type: integer
              description: Input audio sample rate in Hz.
              default: 16000
            encoding:
              type: string
              description: Input audio encoding format.
              default: linear16
              enum:
                - linear16
                - flac
                - mulaw
                - amr-nb
                - amr-wb
                - opus
                - speex
                - mp3
                - mp4
                - webm
                - aac
                - ogg
            enable_partials:
              type: boolean
              description: Enable partial/interim transcription results.
              default: true
            punctuate:
              type: boolean
              description: Add punctuation and capitalization.
              default: false
            smart_format:
              type: boolean
              description: >-
                Apply formatting to improve readability (dates, times, numbers,
                etc.).
              default: false
            diarize:
              type: boolean
              description: >-
                Enable speaker diarization. Words assigned speaker numbers
                starting at 0.
              default: false
            numerals:
              type: boolean
              description: Convert spoken numbers to digits.
              default: false
            profanity_filter:
              type: boolean
              description: Filter profanity from transcript.
              default: false
            utterances:
              type: boolean
              description: Segment transcript into utterances.
              default: false
            paragraphs:
              type: boolean
              description: Add paragraph formatting.
              default: false
            filler_words:
              type: boolean
              description: Include filler words (uh, um) in transcript.
              default: false
            multichannel:
              type: boolean
              description: Enable multi-channel audio processing.
              default: false
            endpointing:
              type: integer
              minimum: 0
              default: 10
              description: >-
                Time in milliseconds of silence before finalizing speech. Set to
                0 to disable endpointing entirely.
            utterance_end_ms:
              type: integer
              minimum: 200
              maximum: 5000
              default: 1000
              description: >-
                Time in milliseconds of silence between words before sending an
                UtteranceEnd message. Default is 1000ms, minimum 200ms, maximum
                5000ms. Requires enable_partials to be true.
