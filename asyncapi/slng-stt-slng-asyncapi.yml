    DeepgramSttMetadata:
      name: DeepgramSttMetadata
      title: Metadata
      summary: >
        Deepgram session metadata. Sent when the backend connects and again
        after the session ends with final statistics. This is informational — do
        not wait for it before streaming audio.
      contentType: application/json
      payload:
        type: object
        description: >
          Deepgram native Metadata message. Received twice: once when the
          session opens (duration=0) and once after finalize with the full
          session summary.
        required:
          - type
        properties:
          type:
            type: string
            const: Metadata
          request_id:
            type: string
            description: Unique Deepgram request identifier
          created:
            type: string
            format: date-time
            description: Timestamp when the session was created
          duration:
            type: number
            description: >-
              Total audio duration processed in seconds (0 on initial, populated
              on final)
          channels:
            type: integer
            description: Number of audio channels
          sha256:
            type: string
            description: SHA-256 hash of the audio (populated on final Metadata only)
          transaction_key:
            type: string
            description: Deprecated field (always "deprecated")
      examples:
        - name: deepgramMetadataOpen
          summary: Session opened (initial Metadata)
          payload:
            type: Metadata
            request_id: a2b1db35-40ff-41f9-9912-dedaeab02228
            created: 2026-04-01T09:40:09.152Z
            duration: 0
            channels: 1
            sha256: incomplete
            transaction_key: deprecated
        - name: deepgramMetadataFinal
          summary: Session complete (final Metadata)
          payload:
            type: Metadata
            request_id: a2b1db35-40ff-41f9-9912-dedaeab02228
            created: 2026-04-01T09:40:09.152Z
            duration: 19.78
            channels: 1
            sha256: 34f3ece92c8345e1fbcb497f5189a3b1448457e6ab18d93d6234308580a3fd81
            transaction_key: deprecated
    KeepaliveMessage:
