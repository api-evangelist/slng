      title: Final Transcript
      summary: Final Whisper transcription result with segment-level detail.
      contentType: application/json
      payload:
        type: object
        description: >-
          Final transcription result from Whisper. Includes the complete
          transcript, segment-level timing with log probabilities, and total
          audio duration.
        required:
          - type
          - transcript
        properties:
          type:
            type: string
            const: final_transcript
