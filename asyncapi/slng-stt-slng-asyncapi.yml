                - mp3
                - mp4
                - webm
                - aac
                - ogg
            enable_partials:
              type: boolean
              description: Enable partial/interim transcription results.
              default: true
            punctuate:
              type: boolean
              description: Add punctuation and capitalization.
              default: false
            smart_format:
              type: boolean
              description: >-
                Apply formatting to improve readability (dates, times, numbers,
                etc.).
              default: false
            diarize:
              type: boolean
              description: >-
                Enable speaker diarization. Words assigned speaker numbers
                starting at 0.
              default: false
            numerals:
              type: boolean
              description: Convert spoken numbers to digits.
              default: false
            profanity_filter:
              type: boolean
              description: Filter profanity from transcript.
              default: false
            utterances:
              type: boolean
              description: Segment transcript into utterances.
              default: false
            paragraphs:
              type: boolean
              description: Add paragraph formatting.
              default: false
            filler_words:
              type: boolean
              description: Include filler words (uh, um) in transcript.
              default: false
            multichannel:
              type: boolean
              description: Enable multi-channel audio processing.
              default: false
            endpointing:
              type: integer
              minimum: 0
              default: 10
              description: >-
                Time in milliseconds of silence before finalizing speech. Set to
                0 to disable endpointing entirely.
            utterance_end_ms:
              type: integer
              minimum: 200
              maximum: 5000
              default: 1000
              description: >-
                Time in milliseconds of silence between words before sending an
                UtteranceEnd message. Default is 1000ms, minimum 200ms, maximum
                5000ms. Requires enable_partials to be true.
    WebsocketHeadersSlngWhisper:
      type: object
      properties:
        X-World-Part-Override:
          type: string
          description: >-
            Target world part override. Auto-selected if not provided. Available
            world parts: `eu`.
          enum:
            - eu
    SlngWhisperSttInitPayload:
      type: object
      description: >-
        Initialize a Whisper STT session with recognition configuration before
        streaming audio.
      required:
        - type
      properties:
        type:
          type: string
          const: init
        config:
          type: object
          description: >-
            Whisper recognition configuration options. Features like VAD,
            partial transcripts, and language detection are enabled by default
            and reported in the ready response.
          properties:
            language:
              $ref: '#/components/schemas/WhisperLanguageCode'
            sample_rate:
              type: integer
              description: Input audio sample rate in Hz.
              default: 16000
            encoding:
              type: string
              description: Input audio encoding format.
              default: linear16
              enum:
                - linear16
                - mp3
                - opus
